name: 뉴스 수집 자동화

on:
  schedule:
    # GitHub 예약 실행은 많이 밀린다. 2026-11-25에 최근 30회를 다시 재 보니
    # 아침 갱신 도착이 KST 07:12~08:51이었다 — 앞선 주석의 '2~4시간 40분'보다 길다.
    # 11/04에 02:20으로 당겼는데도 여섯 번 중 네 번이 08시를 넘겼다.
    #
    # **밀리는 것보다 나쁜 건 틱이 통째로 빠지는 것이다.** 2026-11-02 · 11-23 · 11-24
    # 아침 틱이 아예 안 떴다. 그래서 앞당기기만 하지 않고 **틱을 하나 더 두어**
    # 하나가 빠져도 업무 시작 전에 한 번은 돌게 했다(2026-11-25).
    #
    # **15:00 UTC 아래로는 내리지 말 것** — 15:00 UTC가 KST 자정이다. 그 아래면
    # 실행 시각이 KST 자정 전이 되어 수집 범위(end_dt = 오늘 00:00 KST)가 하루
    # 당겨지고 어제 기사를 통째로 놓친다. 밀리는 쪽은 늘 안전하다.
    - cron: "20 15 * * *"   # KST 00:20 → 실측 지연이면 00:30~06:10
    - cron: "20 18 * * *"   # KST 03:20 → 03:30~09:10 (위 틱이 빠지는 날의 보험)
    - cron: "17 23 * * *"   # KST 08:17 → 10~13시 (늦게 올라온 기사 보완)
  workflow_dispatch:

# 보강 워크플로우와 같은 CSV를 고치므로 동시에 돌지 않게 한다
concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl google-auth anthropic

      - name: CSV 오염 데이터 정리
        run: python clean_csv.py

      - name: 뉴스 수집 (매일)
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python naver_to_csv.py

      # 보강이 실패해도 수집한 기사는 반드시 커밋되도록 continue-on-error
      - name: 기사 보강 (기자명·지면·출입기자)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORTER_SHEET_ID:           ${{ secrets.REPORTER_SHEET_ID }}
          REPORTER_SHEET_RANGE:        ${{ secrets.REPORTER_SHEET_RANGE }}
          REPORTER_SHEET_CSV_URL:      ${{ secrets.REPORTER_SHEET_CSV_URL }}
        run: python enrich_articles.py

      # AI 판정 — 새로 들어온 기사만 묻는다. 키가 없으면(운영 저장소) 바로 끝난다.
      # 실패해도 수집·보강 결과는 커밋되도록 continue-on-error
      - name: AI 판정 (논조·실적·정책·이슈)
        continue-on-error: true
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAYS: "7"
          AI_MINUTES: "10"
        run: python ai_classify.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "자동 수집 $(date +'%Y-%m-%d')"
          # 다른 실행이 먼저 같은 CSV를 올려 충돌하면 이번 결과를 버리고 정상 종료한다.
          # 빠진 날짜는 다음 실행의 백필이 다시 수집한다
          # --autostash: 스테이징 안 된 변경이 남아 있어도 rebase가 거부되지 않게 한다.
          # 2026-10-14에 이것 때문에 판정 결과를 통째로 버린 실행이 있었다
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            echo "원격이 앞서 있어 이번 수집 결과는 버렸습니다 (다음 실행에서 백필)"
            exit 0
          fi
          git push
