name: 뉴스 수집 자동화

on:
  schedule:
    # GitHub 예약 실행이 1시간 45분쯤 밀려서, 아침 6시쯤 돌도록 앞당겨 둠
    - cron: "20 19 * * *"   # KST 04:20 → 실제로는 06시 전후
    - cron: "17 23 * * *"   # KST 08:17 → 실제로는 10시 전후 (늦게 올라온 기사 보완)
    - cron: "0 0 * * 1"
  workflow_dispatch:

# 보강 워크플로우와 같은 CSV를 고치므로 동시에 돌지 않게 한다
concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl google-auth

      - name: CSV 오염 데이터 정리
        run: python clean_csv.py

      - name: 뉴스 수집 (매일)
        if: github.event.schedule != '0 0 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python naver_to_csv.py

      - name: 주간 보고서 생성 (매주 월요일)
        if: github.event.schedule == '0 0 * * 1'
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python generate_weekly_report.py

      # 보강이 실패해도 수집한 기사는 반드시 커밋되도록 continue-on-error
      - name: 기사 보강 (기자명·지면·출입기자)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORTER_SHEET_ID:           ${{ secrets.REPORTER_SHEET_ID }}
          REPORTER_SHEET_RANGE:        ${{ secrets.REPORTER_SHEET_RANGE }}
          REPORTER_SHEET_CSV_URL:      ${{ secrets.REPORTER_SHEET_CSV_URL }}
        run: python enrich_articles.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "자동 수집 $(date +'%Y-%m-%d')"
          # 다른 실행이 먼저 같은 CSV를 올려 충돌하면 이번 결과를 버리고 정상 종료한다.
          # 빠진 날짜는 다음 실행의 백필이 다시 수집한다
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            echo "원격이 앞서 있어 이번 수집 결과는 버렸습니다 (다음 실행에서 백필)"
            exit 0
          fi
          git push
