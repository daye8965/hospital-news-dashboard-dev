name: AI 판정 (수동)

on:
  workflow_dispatch:   # 매일 수집 워크플로우 안에도 AI 판정 단계가 있음. 과거 기사를 한 번에 채울 때 쓴다
    inputs:
      days:
        description: "최근 며칠치를 판정할지"
        default: "60"
      max_calls:
        description: "API 호출 상한 (경량 모델 기준 1회 약 0.2~0.4센트)"
        default: "800"

# 수집·보강 워크플로우와 같은 docs/를 고치므로 동시에 돌지 않게 한다
concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests anthropic

      - name: AI 판정
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAYS:      ${{ inputs.days }}
          AI_MAX_CALLS: ${{ inputs.max_calls }}
          AI_MINUTES:   "45"
        run: python ai_classify.py

      - name: 변경사항 커밋 & 푸시
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f docs/ai_labels.json ] || { echo "판정 결과 파일 없음"; exit 0; }
          git add docs/ai_labels.json
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "AI 판정 $(date +'%Y-%m-%d %H:%M')"
          # 이 커밋은 ai_labels.json만 담고, 이 파일을 고치는 수집 워크플로우와는 동시에 돌지 않아
          # 보통 충돌하지 않는다. 그래도 충돌하면 이번 결과를 버린다 — 다음 실행이 이어서 채운다
          # --autostash: 스테이징 안 된 변경이 남아 있어도 rebase가 거부되지 않게 한다.
          # 2026-10-14에 이것 때문에 판정 결과를 통째로 버린 실행이 있었다
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "원격과 충돌해 이번 판정 결과는 버렸습니다 (다음 실행에서 다시 채움)"
            exit 0
          fi
          git push
